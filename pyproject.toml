[project]
name = "provider-ranking-agent"
version = "0.1.0"
description = "Provider ranking agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "yoyo-migrations>=8.2",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "fastapi>=0.136.1",
    "uvicorn>=0.30",
    "psycopg-pool>=3.3.1",
    "bs4>=0.0.1",
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*",]
