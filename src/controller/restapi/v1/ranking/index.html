<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Агент ранжирования провайдеров</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <style>
        :root {
            --c-primary: #00AAE6;
            --c-primary-dark: #0096D2;
            --c-primary-darker: #007DB5;
            --c-primary-light: #E6F7FD;
            --c-primary-tint: #CCF0FB;
            --c-text: #181A1F;
            --c-text-secondary: #5A6478;
            --c-text-muted: #889CAF;
            --c-bg: #FFFFFF;
            --c-surface: #F7F7F8;
            --c-border: #E1E5EA;
            --c-border-light: #EFEFF2;
            --c-user-bubble: #00AAE6;
            --c-assistant-bubble: #F7F7F8;
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,170,230,0.10);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 400;
            color: var(--c-text);
            background: var(--c-bg);
            -webkit-font-smoothing: antialiased;
        }

        /* ── Layout ─────────────────────────────────────────── */
        .app {
            display: flex;
            height: 100vh;
        }

        /* ── Sidebar ─────────────────────────────────────────── */
        .sidebar {
            width: 280px;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            background: var(--c-bg);
            border-right: 1px solid var(--c-border);
        }

        .sidebar-header {
            padding: 20px 16px 16px;
            border-bottom: 1px solid var(--c-border-light);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .brand-logo svg { display: block; }

        .brand-label {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 500;
            color: var(--c-text);
            line-height: 1.3;
        }

        .brand-sub {
            font-size: 11px;
            color: var(--c-text-muted);
            line-height: 1.3;
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px 16px;
            background: var(--c-primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s;
        }
        .new-chat-btn:hover { background: var(--c-primary-dark); }
        .new-chat-btn:active { background: var(--c-primary-darker); }

        .new-chat-btn svg { flex-shrink: 0; }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .chat-list-label {
            padding: 10px 8px 6px;
            font-size: 11px;
            font-weight: 500;
            color: var(--c-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .chat-item {
            padding: 9px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: var(--c-text-secondary);
            margin-bottom: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.12s, color 0.12s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-item:hover { background: var(--c-surface); color: var(--c-text); }
        .chat-item.active {
            background: var(--c-primary-light);
            color: var(--c-primary-dark);
            font-weight: 500;
        }
        .chat-item-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--c-border);
            flex-shrink: 0;
            transition: background 0.12s;
        }
        .chat-item.active .chat-item-dot { background: var(--c-primary); }

        .empty-list {
            padding: 20px 12px;
            font-size: 13px;
            color: var(--c-text-muted);
            text-align: center;
        }

        /* ── Main ────────────────────────────────────────────── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--c-bg);
        }

        .main-header {
            padding: 16px 28px;
            border-bottom: 1px solid var(--c-border);
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 64px;
        }

        .main-header-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--c-primary-light);
            color: var(--c-primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .main-header-text {}

        .main-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--c-text);
            line-height: 1.3;
        }

        .main-sub {
            font-size: 12px;
            color: var(--c-text-muted);
            margin-top: 1px;
        }

        /* ── Messages ────────────────────────────────────────── */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 28px 28px 12px;
            background: var(--c-surface);
        }

        .messages-inner {
            max-width: 820px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 48px 24px;
            text-align: center;
            color: var(--c-text-muted);
        }

        .placeholder-icon {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: var(--c-bg);
            border: 1px solid var(--c-border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }

        .placeholder h2 {
            font-size: 18px;
            font-weight: 500;
            color: var(--c-text);
            margin-bottom: 8px;
        }

        .placeholder p {
            font-size: 14px;
            max-width: 360px;
            line-height: 1.6;
        }

        /* ── Message bubbles ─────────────────────────────────── */
        .message {
            display: flex;
            gap: 10px;
            max-width: 78%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 500;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .avatar.user {
            background: var(--c-primary);
            color: #fff;
        }

        .avatar.assistant {
            background: var(--c-bg);
            border: 1px solid var(--c-border);
            color: var(--c-primary-dark);
        }

        .bubble {
            padding: 11px 15px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user .bubble {
            background: var(--c-user-bubble);
            color: #fff;
            border-top-right-radius: 3px;
            white-space: pre-wrap;
        }

        .message.assistant .bubble {
            background: var(--c-bg);
            color: var(--c-text);
            border-top-left-radius: 3px;
            border: 1px solid var(--c-border-light);
            box-shadow: var(--shadow-sm);
        }

        /* Markdown inside assistant bubble */
        .bubble.md p { margin: 0 0 8px; }
        .bubble.md p:last-child { margin-bottom: 0; }
        .bubble.md ul, .bubble.md ol { margin: 4px 0 8px; padding-left: 20px; }
        .bubble.md li { margin-bottom: 3px; }
        .bubble.md h1, .bubble.md h2, .bubble.md h3 {
            margin: 10px 0 4px;
            font-size: 1em;
            font-weight: 500;
        }
        .bubble.md h1:first-child,
        .bubble.md h2:first-child,
        .bubble.md h3:first-child { margin-top: 0; }
        .bubble.md code {
            background: var(--c-primary-light);
            border-radius: 4px;
            padding: 1px 5px;
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 13px;
            color: var(--c-primary-darker);
        }
        .bubble.md pre {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: 8px;
            padding: 10px 12px;
            overflow-x: auto;
            margin: 6px 0;
        }
        .bubble.md pre code { background: none; padding: 0; color: inherit; }
        .bubble.md blockquote {
            border-left: 3px solid var(--c-primary);
            margin: 6px 0;
            padding: 2px 10px;
            color: var(--c-text-secondary);
        }
        .bubble.md a { color: var(--c-primary-dark); text-decoration: underline; }
        .bubble.md strong { font-weight: 500; }
        .bubble.md hr { border: none; border-top: 1px solid var(--c-border); margin: 8px 0; }
        .bubble.md table { border-collapse: collapse; font-size: 13px; margin: 6px 0; }
        .bubble.md th, .bubble.md td {
            border: 1px solid var(--c-border);
            padding: 5px 10px;
        }
        .bubble.md th { background: var(--c-surface); font-weight: 500; }

        /* ── Typing indicator ────────────────────────────────── */
        .typing {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            padding: 4px 0;
        }
        .typing span {
            width: 5px;
            height: 5px;
            background: var(--c-primary);
            border-radius: 50%;
            opacity: 0.4;
            animation: bounce 1.2s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        /* ── Status line ─────────────────────────────────────── */
        .status-line {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--c-text-muted);
            padding: 4px 0 2px;
        }
        .status-spinner {
            width: 12px;
            height: 12px;
            border: 2px solid var(--c-border);
            border-top-color: var(--c-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Suggestions ─────────────────────────────────────── */
        .suggestions {
            max-width: 820px;
            margin: 0 auto 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0 2px;
        }

        .suggestion-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .suggestion-group-label {
            font-size: 12px;
            color: var(--c-text-muted);
            padding-left: 4px;
        }

        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .suggestion-chip {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--c-primary);
            background: var(--c-primary-light);
            color: var(--c-primary-darker);
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
            white-space: nowrap;
        }
        .suggestion-chip:hover {
            background: var(--c-primary);
            color: #fff;
        }

        /* ── Composer ────────────────────────────────────────── */
        .composer {
            border-top: 1px solid var(--c-border);
            padding: 8px 28px 18px;
            background: var(--c-bg);
        }

        .composer-inner {
            max-width: 820px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: 12px;
            padding: 8px 8px 8px 14px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .composer-inner:focus-within {
            border-color: var(--c-primary);
            box-shadow: 0 0 0 3px rgba(0,170,230,0.12);
            background: var(--c-bg);
        }

        .composer textarea {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 14px;
            color: var(--c-text);
            line-height: 1.6;
            padding: 6px 0;
            max-height: 180px;
            min-height: 24px;
        }

        .composer textarea::placeholder { color: var(--c-text-muted); }

        .send-btn {
            background: var(--c-primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            width: 38px;
            height: 38px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s;
        }
        .send-btn:hover:not(:disabled) { background: var(--c-primary-dark); }
        .send-btn:disabled { background: var(--c-border); cursor: not-allowed; }

        /* ── Scrollbar ───────────────────────────────────────── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--c-text-muted); }

        @media (max-width: 720px) {
            .sidebar { width: 220px; min-width: 220px; }
            .messages, .composer { padding-left: 16px; padding-right: 16px; }
            .main-header { padding-left: 16px; padding-right: 16px; }
        }
    </style>
</head>
<body>
<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <div class="brand-label">
                    <div class="brand-name">Агент ранжирования</div>
                </div>
            </div>
            <button class="new-chat-btn" id="new-chat-btn">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7 1v12M1 7h12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                </svg>
                Новый чат
            </button>
        </div>
        <div class="chat-list" id="chat-list">
            <div class="chat-list-label">Ваши чаты</div>
            <div class="empty-list" id="empty-list">Чатов пока нет</div>
        </div>
    </aside>

    <!-- Main -->
    <main class="main">
        <header class="main-header">
            <div class="main-header-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18a8 8 0 110-16 8 8 0 010 16zm-1-5h2v2h-2v-2zm0-8h2v6h-2V7z" fill="#00AAE6"/>
                </svg>
            </div>
            <div class="main-header-text">
                <div class="main-title" id="main-title">Выберите чат</div>
                <div class="main-sub" id="main-sub">Создайте новый чат, чтобы начать общение с агентом</div>
            </div>
        </header>

        <div class="messages" id="messages">
            <div class="placeholder" id="placeholder">
                <h2>Добро пожаловать</h2>
                <p>Я помогу подобрать оптимального облачного провайдера под ваши требования. Создайте новый чат или выберите существующий, чтобы начать.</p>
            </div>
        </div>

        <div class="composer">
            <div class="suggestions" id="suggestions" style="display:none;"></div>
            <div class="composer-inner">
                <textarea id="input" placeholder="Опишите задачу или требования к провайдеру..." rows="1" disabled></textarea>
                <button class="send-btn" id="send-btn" disabled title="Отправить">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 13V3M3 8l5-5 5 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </main>
</div>

<script>
    const API_BASE = "/api/v1/chats";

    const state = {
        chats: [],
        activeChatId: null,
        sending: false,
    };

    const $list        = document.getElementById("chat-list");
    const $empty       = document.getElementById("empty-list");
    const $newChatBtn  = document.getElementById("new-chat-btn");
    const $messages    = document.getElementById("messages");
    const $input       = document.getElementById("input");
    const $sendBtn     = document.getElementById("send-btn");
    const $title       = document.getElementById("main-title");
    const $sub         = document.getElementById("main-sub");
    const $suggestions = document.getElementById("suggestions");

    const SUGGESTIONS_MARKER = "__SUGGESTIONS__:";
    const STATUS_MARKER      = "__STATUS__:";

    function shortId(id) { return id.split("-")[0]; }

    function renderChatList() {
        $list.querySelectorAll(".chat-item").forEach(el => el.remove());
        if (state.chats.length === 0) { $empty.style.display = "block"; return; }
        $empty.style.display = "none";
        state.chats.forEach((chatId, idx) => {
            const el = document.createElement("div");
            el.className = "chat-item" + (chatId === state.activeChatId ? " active" : "");
            el.innerHTML = `<span class="chat-item-dot"></span>Чат #${state.chats.length - idx} · ${shortId(chatId)}`;
            el.onclick = () => openChat(chatId);
            $list.appendChild(el);
        });
    }

    function setComposerEnabled(enabled) {
        $input.disabled = !enabled;
        $sendBtn.disabled = !enabled || $input.value.trim() === "";
    }

    function ensureMessagesContainer() {
        let inner = $messages.querySelector(".messages-inner");
        if (!inner) {
            $messages.innerHTML = "";
            inner = document.createElement("div");
            inner.className = "messages-inner";
            $messages.appendChild(inner);
        }
        return inner;
    }

    function appendMessage(role, text) {
        const inner = ensureMessagesContainer();
        const wrap = document.createElement("div");
        wrap.className = `message ${role}`;

        const avatar = document.createElement("div");
        avatar.className = `avatar ${role}`;
        avatar.textContent = role === "user" ? "Я" : "А";

        const bubble = document.createElement("div");
        if (role === "assistant") {
            bubble.className = "bubble md";
            bubble.innerHTML = marked.parse(text);
        } else {
            bubble.className = "bubble";
            bubble.textContent = text;
        }

        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        inner.appendChild(wrap);
        scrollToBottom();
        return bubble;
    }

    function appendTyping() {
        const inner = ensureMessagesContainer();
        const wrap = document.createElement("div");
        wrap.className = "message assistant";
        wrap.id = "typing-wrap";

        const avatar = document.createElement("div");
        avatar.className = "avatar assistant";
        avatar.textContent = "А";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

        wrap.appendChild(avatar);
        wrap.appendChild(bubble);
        inner.appendChild(wrap);
        scrollToBottom();
        return { wrap, bubble };
    }

    function scrollToBottom() {
        $messages.scrollTop = $messages.scrollHeight;
    }

    function clearSuggestions() {
        $suggestions.innerHTML = "";
        $suggestions.style.display = "none";
    }

    function appendAnswer(question, answer) {
        // Существующий текст в инпуте сохраняем, чтобы можно было собрать
        // ответ сразу на несколько вопросов: "<вопрос1> <ответ1>\n<вопрос2> <ответ2>".
        const prefix = $input.value.trim();
        const line = `${question} ${answer}`;
        $input.value = prefix ? `${prefix}\n${line}` : line;
    }

    function showSuggestions(groups) {
        clearSuggestions();
        if (!groups || groups.length === 0) return;

        // Обратная совместимость: если пришёл плоский массив строк — обернём в одну группу.
        const normalized = (typeof groups[0] === "string")
            ? [{ question: "", suggestions: groups }]
            : groups;

        normalized.forEach(group => {
            const question = group.question || "";
            const items = group.suggestions || [];
            if (items.length === 0) return;

            const groupEl = document.createElement("div");
            groupEl.className = "suggestion-group";

            if (question) {
                const label = document.createElement("div");
                label.className = "suggestion-group-label";
                label.textContent = question;
                groupEl.appendChild(label);
            }

            const chips = document.createElement("div");
            chips.className = "suggestion-chips";
            items.forEach(value => {
                const chip = document.createElement("button");
                chip.className = "suggestion-chip";
                chip.textContent = value;
                chip.onclick = () => {
                    if (question) {
                        appendAnswer(question, value);
                    } else {
                        $input.value = value;
                    }
                    autoresize();
                    $sendBtn.disabled = false;
                    // Скрываем только сработавшую группу, оставляем остальные,
                    // чтобы пользователь мог ответить сразу на несколько вопросов.
                    groupEl.remove();
                    if (!$suggestions.querySelector(".suggestion-group")) {
                        clearSuggestions();
                    }
                    $input.focus();
                };
                chips.appendChild(chip);
            });

            groupEl.appendChild(chips);
            $suggestions.appendChild(groupEl);
        });

        if ($suggestions.querySelector(".suggestion-group")) {
            $suggestions.style.display = "flex";
        }
    }

    async function loadChats() {
        try {
            const res = await fetch(API_BASE, { credentials: "include" });
            if (!res.ok) throw new Error();
            const data = await res.json();
            state.chats = data.chats || [];
            renderChatList();
        } catch (e) { console.error(e); }
    }

    async function createChat() {
        try {
            const res = await fetch(API_BASE, { method: "POST", credentials: "include" });
            if (!res.ok) throw new Error();
            const data = await res.json();
            state.chats.unshift(data.chat_id);
            renderChatList();
            openChat(data.chat_id);
        } catch (e) {
            console.error(e);
            alert("Не удалось создать чат");
        }
    }

    async function openChat(chatId) {
        state.activeChatId = chatId;
        renderChatList();
        clearSuggestions();
        $title.textContent = `Чат · ${shortId(chatId)}`;
        $sub.textContent = "Общение с агентом ранжирования провайдеров";
        $messages.innerHTML = "";

        try {
            const res = await fetch(`${API_BASE}/${chatId}`, { credentials: "include" });
            if (!res.ok) throw new Error();
            const data = await res.json();
            const msgs = data.messages || [];
            if (msgs.length === 0) {
                const inner = ensureMessagesContainer();
                const hint = document.createElement("div");
                hint.style.cssText = "text-align:center;color:var(--c-text-muted);font-size:13px;padding:32px;";
                hint.textContent = "Начните диалог — отправьте первое сообщение";
                inner.appendChild(hint);
            } else {
                msgs.forEach(m => {
                    const role = m.role === "user" ? "user" : "assistant";
                    appendMessage(role, m.content ?? m.text ?? "");
                });
            }
        } catch (e) { console.error(e); }

        setComposerEnabled(true);
        $input.focus();
    }

    // Убираем все __STATUS__:... строки из текста и возвращаем последний статус.
    function extractStatuses(raw) {
        const lines = raw.split("\n");
        const clean = [];
        let lastStatus = null;
        for (const line of lines) {
            if (line.startsWith(STATUS_MARKER)) {
                lastStatus = line.slice(STATUS_MARKER.length).trim();
            } else {
                clean.push(line);
            }
        }
        return { text: clean.join("\n"), lastStatus };
    }

    function extractSuggestions(raw) {
        // Split off __SUGGESTIONS__:{...} marker appended at the end of the stream.
        const markerIdx = raw.indexOf("\n" + SUGGESTIONS_MARKER);
        if (markerIdx === -1) return { text: raw, suggestions: null };
        const jsonStr = raw.slice(markerIdx + 1 + SUGGESTIONS_MARKER.length).trim();
        const text = raw.slice(0, markerIdx);
        try {
            return { text, suggestions: JSON.parse(jsonStr) };
        } catch (_) {
            return { text, suggestions: null };
        }
    }

    function setStatusLine(bubble, text) {
        let el = bubble.querySelector(".status-line");
        if (!text) { if (el) el.remove(); return; }
        if (!el) {
            el = document.createElement("div");
            el.className = "status-line";
            el.innerHTML = '<div class="status-spinner"></div><span></span>';
            bubble.prepend(el);
        }
        el.querySelector("span").textContent = text;
    }

    async function sendMessage() {
        const text = $input.value.trim();
        if (!text || !state.activeChatId || state.sending) return;

        state.sending = true;
        $input.value = "";
        autoresize();
        clearSuggestions();
        setComposerEnabled(false);

        const inner = ensureMessagesContainer();
        inner.querySelectorAll("div[style*='text-align:center']").forEach(el => el.remove());

        appendMessage("user", text);
        const { wrap: typingWrap, bubble: typingBubble } = appendTyping();

        try {
            const res = await fetch(`${API_BASE}/${state.activeChatId}/messages`, {
                method: "POST",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text }),
            });
            if (!res.ok || !res.body) throw new Error(`Ошибка ${res.status}`);

            typingBubble.innerHTML = "";
            typingBubble.className = "bubble md";

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let acc = "";
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                acc += decoder.decode(value, { stream: true });

                // Strip status and suggestion markers before rendering.
                const { text: noStatus, lastStatus } = extractStatuses(acc);
                const { text: visibleText } = extractSuggestions(noStatus);

                const hasRealText = visibleText.trim().length > 0;
                if (hasRealText) {
                    // Real content arrived — remove status, render markdown.
                    setStatusLine(typingBubble, null);
                    typingBubble.innerHTML = marked.parse(visibleText);
                } else if (lastStatus) {
                    // Still in tool-loop phase — show spinner + status.
                    typingBubble.innerHTML = "";
                    setStatusLine(typingBubble, lastStatus);
                }
                scrollToBottom();
            }

            // Final pass: extract suggestions and show chips.
            const { text: noStatusFinal } = extractStatuses(acc);
            const { text: finalText, suggestions } = extractSuggestions(noStatusFinal);
            setStatusLine(typingBubble, null);
            typingBubble.innerHTML = marked.parse(finalText);
            if (suggestions) showSuggestions(suggestions);

            typingWrap.id = "";
        } catch (e) {
            console.error(e);
            typingBubble.textContent = "Произошла ошибка при получении ответа.";
        } finally {
            state.sending = false;
            setComposerEnabled(true);
            $input.focus();
        }
    }

    function autoresize() {
        $input.style.height = "auto";
        $input.style.height = Math.min($input.scrollHeight, 180) + "px";
    }

    $newChatBtn.addEventListener("click", createChat);
    $sendBtn.addEventListener("click", sendMessage);
    $input.addEventListener("input", () => {
        autoresize();
        $sendBtn.disabled = $input.disabled || $input.value.trim() === "";
    });
    $input.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    loadChats();
</script>
</body>
</html>
